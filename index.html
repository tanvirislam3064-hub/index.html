<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You 💖</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  text-align:center;
  overflow:hidden;
  transition:1s;
  color:white;
}

.page1{background: linear-gradient(135deg,#ff9a9e,#fecfef,#ffdde1);}
.page2{background: linear-gradient(135deg,#ff758c,#ff7eb3);}
.page3{background: linear-gradient(135deg,#f6d365,#fda085);}
.page4{background: radial-gradient(circle,#ffb6c1,#ff69b4,#ff1493);}
.page5{background: radial-gradient(circle,#ff9ec4,#ff4fa3,#ff1493);}

.page{display:none; padding-top:100px;}
.active{display:block;}

button{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:white;
  color:#ff1493;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  font-size:16px;
}

.bigHeart{
  font-size:90px;
  animation: pulse 1s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}
</style>
</head>

<body class="page1">

<!-- AUDIO -->
<audio id="birthdayMusic" src="birthday.mp3"></audio>

<!-- PAGE 1 -->
<div id="p1" class="page active">
  <h1>Enter Your Name 💖</h1>
  <input type="text" id="nameInput" placeholder="Your Name">
  <br>
  <button onclick="nextPage(2)">Continue</button>
</div>

<!-- PAGE 2 -->
<div id="p2" class="page">
  <h2>You are very special 💕</h2>
  <button onclick="nextPage(3)">Next</button>
</div>

<!-- PAGE 3 -->
<div id="p3" class="page">
  <h2>Someone has a surprise for you 😌</h2>
  <button onclick="nextPage(4)">Next</button>
</div>

<!-- PAGE 4 (BIRTHDAY PAGE) -->
<div id="p4" class="page">
  <div class="bigHeart">🎂</div>
  <h1>Happy Birthday Dear 💖</h1>
  <button onclick="nextPage(5)">Next</button>
</div>

<!-- PAGE 5 -->
<div id="p5" class="page">
  <h1>Happy Friendship Day ❤️</h1>
</div>

<script>

function nextPage(num){
  let pages=document.querySelectorAll(".page");
  pages.forEach(p=>p.classList.remove("active"));

  document.getElementById("p"+num).classList.add("active");
  document.body.className="page"+num;

  /* PLAY MUSIC WHEN PAGE 4 OPENS */
  if(num==4){
    let music=document.getElementById("birthdayMusic");
    music.play();
  }

  /* STOP MUSIC AFTER PAGE 4 */
  if(num==5){
    let music=document.getElementById("birthdayMusic");
    music.pause();
    music.currentTime=0;
  }
}

</script>

</body>
</html>
