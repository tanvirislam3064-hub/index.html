<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Favourite Person 💖</title>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  text-align:center;
  color:black;
  overflow:hidden;
}

.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:relative;
}

button{
  padding:10px 20px;
  font-size:18px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  margin:10px;
  color:black;
  background:white;
}

input{
  padding:10px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  color:black;
}

/* Page 1 */
#page1{
  background: radial-gradient(circle,#ffb6c1,#ff69b4,#ff1493);
}

/* Page 4 */
#page4{
  background: linear-gradient(135deg,#ffb6c1,#ff69b4,#ff1493);
  overflow:hidden;
}

/* Page 5 */
#page5{
  background: radial-gradient(circle,#ff9ec4,#ff4fa3,#ff1493);
  overflow:hidden;
}

/* Floating heart animation */
.floatingHeart{
  position:absolute;
  font-size:20px;
  animation: float 5s linear infinite;
}

@keyframes float{
  0%{transform:translateY(0);}
  100%{transform:translateY(-100vh);}
}

/* Movable heart */
#heart{
  position:absolute;
  font-size:50px;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page" id="page1" style="display:flex;">
  <h1>Enter Your Name 💕</h1>
  <input type="text" id="nameInput" placeholder="Your name">
  <button onclick="goToPage2()">Next</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <h1 id="questionText"></h1>
  <button onclick="goToPage3()">Yes 😁</button>
  <button id="noBtn">No 😜</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h1>Catch the Heart ❤️</h1>
  <div id="heart">❤️</div>
  <div id="afterCatch"></div>
  <button id="toBirthdayBtn" onclick="goToPage4()" style="display:none;">Next 💝</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h1></h1>
  <h2 id="birthdayText"></h2>
  <div id="birthdayExtraText">
    Happy birthdayy Tasmiaa ❤️<br>
    Heress my littlee workk hehe >-< hopee tmi likee korba.<br>
    anywayss many wishess forr youu 💖
  </div>
  <button onclick="goToPage5()">Next 💖</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="page5">
  <h1 id="friendshipTitle"></h1>
  <h2 id="friendshipMessage" style="width:80%;"></h2>
</div>

<script>
let userName = "";
let heartMoveInterval;

/* Page Switch */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.style.display="none");
  document.getElementById(id).style.display="flex";
}

/* Page 2 */
function goToPage2(){
  userName = document.getElementById("nameInput").value;
  if(userName.trim() === "") return;
  document.getElementById("questionText").innerHTML = userName + ", Do you like me? ";
  showPage("page2");

  const noBtn = document.getElementById("noBtn");

  function moveNo(){
    noBtn.style.position="absolute";
    noBtn.style.top = Math.random()*80 + "%";
    noBtn.style.left = Math.random()*80 + "%";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("click", function(e){
    e.preventDefault();
    moveNo();
  });
}

/* Page 3 */
function goToPage3(){
  showPage("page3");
  moveHeart();
}

function moveHeart(){
  const heart = document.getElementById("heart");

  function randomMove(){
    heart.style.top = Math.random()*80 + "%";
    heart.style.left = Math.random()*80 + "%";
  }

  randomMove();

  heartMoveInterval = setInterval(randomMove, 800);

  heart.onclick = function(){
    clearInterval(heartMoveInterval);
    heart.style.display="none";
    showSupportiveLines();
  }
}

/* Typing Lines */
function showSupportiveLines(){
  const lines = [
    "You stole my heart 💖",
    "One more thing",
    "Ik ur going through a lot but im always here for youu",
    "I am not a speacial guy like i can promise to stayy loyal foreverr tasmia💗",
    "And lastly just stayy with me i will make your depression away😊and aita amio promisee kori madam"
  ];

  let i = 0;

  function typeLine(){
    if(i >= lines.length){
      document.getElementById("toBirthdayBtn").style.display="inline-block";
      return;
    }

    let newLine = document.createElement("h2");
    document.getElementById("afterCatch").appendChild(newLine);

    let text = lines[i];
    let j = 0;

    let interval = setInterval(()=>{
      if(j >= text.length){
        clearInterval(interval);
        i++;
        setTimeout(typeLine, 600);
        return;
      }
      newLine.innerHTML += text[j];
      j++;
    }, 40);
  }

  typeLine();
}

/* Page 4 */
function goToPage4(){
  showPage("page4");
  document.getElementById("birthdayText").innerHTML = "Happy Birthday " + userName + " 🎉💖";
}

/* Page 5 */
function goToPage5(){
  showPage("page5");

  let title="Happy Friendship Day ❤️";
  let i=0;

  function typeTitle(){
    if(i<title.length){
      document.getElementById("friendshipTitle").innerHTML+=title.charAt(i);
      i++;
      setTimeout(typeTitle,60);
    } else {
      typeMessage();
    }
  }
  typeTitle();

  function typeMessage(){
    let text="Im reallly luckyy to have you madam 🥰 taii jemon tmi amrr kase speacial person temnii tmii khub matter koro amr kase ar tmr kotha o matter koree . tai kokhono na je tmr kotha omanno korbo🥰 . akhnn jevabee tmr sob ee like korii sarajibonn o same oivabeii krbo Promise🫶";
    let j=0;
    function typing(){
      if(j<text.length){
        document.getElementById("friendshipMessage").innerHTML+=text.charAt(j);
        j++;
        setTimeout(typing,40);
      }
    }
    typing();
  }
}
</script>

</body>
</html>
