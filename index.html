<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You 💖</title>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  text-align:center;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:white;
  overflow:hidden;
}

.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

button{
  padding:10px 20px;
  font-size:18px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  margin:10px;
}

#noBtn{
  position:absolute;
}

#heart{
  font-size:50px;
  position:absolute;
  cursor:pointer;
}

#afterCatch h2{
  margin:15px;
}

</style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page" id="page1" style="display:flex;">
  <h1>Enter Your Name 💕</h1>
  <input type="text" id="nameInput" placeholder="Your name">
  <button onclick="goToPage2()">Next</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <h1 id="questionText"></h1>
  <button onclick="goToPage3()">Yes 😁</button>
  <button id="noBtn" onmouseover="moveNo()">No 😜</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h1>Catch the Heart ❤️</h1>
  <div id="heart">❤️</div>
  <div id="afterCatch"></div>
  <button id="toBirthdayBtn" onclick="goToPage4()" style="display:none;">Next 💝</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h1>🎂 Happy Birthday 🎂</h1>
  <h2 id="birthdayText"></h2>
</div>

<script>

let userName = "";
let tries = 0;

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.style.display="none");
  document.getElementById(id).style.display="flex";
}

function goToPage2(){
  userName = document.getElementById("nameInput").value;
  if(userName.trim() === "") return;
  document.getElementById("questionText").innerHTML = userName + ", Do you like me? 😁😁";
  showPage("page2");
}

function moveNo(){
  let btn = document.getElementById("noBtn");
  btn.style.top = Math.random()*80 + "%";
  btn.style.left = Math.random()*80 + "%";
}

function goToPage3(){
  showPage("page3");
  moveHeart();
}

function moveHeart(){
  let heart = document.getElementById("heart");

  heart.onclick = function(){
    showSupportiveLines();
    heart.style.display="none";
  }

  heart.onmouseover = function(){
    tries++;
    if(tries < 6){
      heart.style.top = Math.random()*80 + "%";
      heart.style.left = Math.random()*80 + "%";
    }
  }
}

function showSupportiveLines(){

  const lines = [
    "You stole my heart 💖",
    "One more thing",
    "Ik ur going through a lot but im always here for youu",
    "I am not a speacial guy like i can promise to stayy loyal foreverr tasmia💗",
    "And lastly just stayy with me i will make your depression away😊and aita amio promisee kori madam"
  ];

  let i = 0;

  function typeLine(){
    if(i >= lines.length){
      document.getElementById("toBirthdayBtn").style.display="inline-block";
      return;
    }

    let newLine = document.createElement("h2");
    document.getElementById("afterCatch").appendChild(newLine);

    let text = lines[i];
    let j = 0;

    let interval = setInterval(()=>{
      if(j >= text.length){
        clearInterval(interval);
        i++;
        setTimeout(typeLine, 600);
        return;
      }
      newLine.innerHTML += text[j];
      j++;
    }, 40);
  }

  typeLine();
}

function goToPage4(){
  showPage("page4");
  document.getElementById("birthdayText").innerHTML =
"Happy Birthday " + userName + " 🎉💖<br><br>" +
"Princess 👑<br><br>" +
"I am veryy happy to meet you Tasmia and There are 8.3Billion people on earth but i still met youu Cutiee . I wishh you the bestt and make our every moment speacial 😊💗";
}

</script>

</body>
</html>
