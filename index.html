<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special 💖</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

.page{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:absolute;
  transition:0.6s ease;
  text-align:center;
  padding:20px;
}

#page1{background:linear-gradient(135deg,#ffb6c1,#ffc0cb);}
#page2{background:linear-gradient(135deg,#ff69b4,#ff85c1);left:100%;color:white;}
#page3{background:linear-gradient(135deg,#ff1493,#ff69b4);left:200%;color:white;}
#page4{background:linear-gradient(135deg,#ffb6c1,#ff69b4);left:300%;color:white;}

input{
  padding:12px;
  font-size:18px;
  border:none;
  border-radius:10px;
  text-align:center;
}

button{
  margin:10px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:white;
  color:#ff4f81;
  cursor:pointer;
  transition:0.3s;
  position:relative;
}

button:hover{transform:scale(1.1);}

h1{font-size:32px;}
h2{font-size:22px;margin-top:15px;}
h3{font-size:20px;margin-top:20px;font-style:italic;}

/* Floating hearts */
.heart-bg{
  position:fixed;
  bottom:-20px;
  font-size:20px;
  animation:floatUp linear infinite;
  opacity:0.7;
}
@keyframes floatUp{
  to{transform:translateY(-110vh);opacity:0;}
}

/* Confetti */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{transform:translateY(100vh) rotate(360deg);}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <h2>Enter your name first 💕</h2>
  <input type="text" id="nameInput" placeholder="Your beautiful name...">
  <button onclick="goToLike()">Continue 💖</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <h1>Do you like me 😁</h1>
  <button onclick="goToHeart()">A. Yes 💖</button>
  <button id="noBtn">B. No 😌</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h1>Catch the heart 💗</h1>
  <div id="gameArea" style="position:relative;width:100%;height:50%;"></div>
  <div id="afterCatch" style="display:none;"></div>
  <button id="toBirthdayBtn" style="display:none;" onclick="goToBirthday()">Continue 🎂</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h1 id="birthdayText"></h1>
  <h2>Princess ❤️</h2>
  <h2 id="birthdayMessage"></h2>
  <h3>To my favourite person 💖</h3>
</div>

<script>

let name="";
let noBtn=document.getElementById("noBtn");

/* Floating background hearts */
function createHeart(){
  let heart=document.createElement("div");
  heart.classList.add("heart-bg");
  heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(4+Math.random()*4)+"s";
  heart.style.fontSize=(15+Math.random()*20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove();},8000);
}
setInterval(createHeart,500);

/* PAGE TRANSITIONS */
function goToLike(){
  name=document.getElementById("nameInput").value;
  if(name===""){alert("Enter your name first 😌");return;}
  document.getElementById("page1").style.left="-100%";
  document.getElementById("page2").style.left="0";
}

/* RUNNING NO BUTTON */
noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

function moveButton(){
  let maxX=window.innerWidth-noBtn.offsetWidth-10;
  let maxY=window.innerHeight-noBtn.offsetHeight-10;
  noBtn.style.position="absolute";
  noBtn.style.left=Math.random()*maxX+"px";
  noBtn.style.top=Math.random()*maxY+"px";
}

function goToHeart(){
  document.getElementById("page2").style.left="-100%";
  document.getElementById("page3").style.left="0";
  initHeartGame();
}

/* SMOOTH HEART GAME */
function initHeartGame(){
  const gameArea=document.getElementById("gameArea");
  gameArea.innerHTML="";
  const heart=document.createElement("div");
  heart.innerHTML="💖";
  heart.style.position="absolute";
  heart.style.fontSize="40px";
  heart.style.cursor="pointer";
  gameArea.appendChild(heart);

  let areaW=gameArea.offsetWidth-40;
  let areaH=gameArea.offsetHeight-40;
  let x=Math.random()*areaW;
  let y=Math.random()*areaH;
  let moves=0;

  function moveHeart(){
    let targetX=Math.random()*areaW;
    let targetY=Math.random()*areaH;
    let steps=40;
    let step=0;

    let interval=setInterval(()=>{
      step++;
      heart.style.left=x+(targetX-x)*step/steps+"px";
      heart.style.top=y+(targetY-y)*step/steps+"px";

      if(step>=steps){
        clearInterval(interval);
        x=targetX;
        y=targetY;
        moves++;
        if(moves<5){moveHeart();}
        else{setTimeout(moveHeart,800);}
      }
    },15);
  }

  moveHeart();

  heart.addEventListener("click",()=>{
    heart.remove();
    showLines();
  });
}

/* AFTER CATCH LINES */
function showLines(){
  let container=document.getElementById("afterCatch");
  container.style.display="block";

  const lines=[
    "You stole my heart 💖",
    "One more thing...",
    "Ik ur going through a lot but im always here for youu",
    "I am not a speacial guy like i can promise to stayy loyal foreverr tasmia💗",
    "And lastly just stayy with me i will make your depression away😊and aita amio promisee kori madam"
  ];

  let i=0;

  function typeNext(){
    if(i>=lines.length){
      document.getElementById("toBirthdayBtn").style.display="inline-block";
      return;
    }

    let newLine=document.createElement("h2");
    container.appendChild(newLine);

    let text=lines[i];
    let j=0;

    let typing=setInterval(()=>{
      if(j>=text.length){
        clearInterval(typing);
        i++;
        setTimeout(typeNext,600);
        return;
      }
      newLine.innerHTML+=text[j];
      j++;
    },40);
  }

  typeNext();
}

/* BIRTHDAY PAGE */
function goToBirthday(){
  document.getElementById("page3").style.left="-100%";
  document.getElementById("page4").style.left="0";

  for(let i=0;i<80;i++){
    let confetti=document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left=Math.random()*100+"vw";
    confetti.style.backgroundColor="hsl("+Math.random()*360+",100%,50%)";
    confetti.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(confetti);
    setTimeout(()=>{confetti.remove();},4000);
  }

  document.getElementById("birthdayText").innerHTML="HAPPY BIRTHDAY "+name.toUpperCase()+"!!! 🎉💖💞💕💗💘";
  document.getElementById("birthdayMessage").innerHTML="I'm so happy to meet you and every moment with you feels special 😊💗";
}

</script>
</body>
</html>
